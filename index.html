<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graham Smith — Digital Operations</title>
  <meta name="description" content="Graham Smith, Digital Operations Manager at Vineyard Gazette Media Group.">
  <meta property="og:title" content="Graham Smith">
  <meta property="og:description" content="Digital Operations Manager, Vineyard Gazette Media Group">
  <meta property="og:image" content="headshot.jpg">
  <style>
    :root { --bg:#fafaf8; --fg:#1c1c1c; --muted:#6b6b6b; --line:#e2e2de; --accent:#1c1c1c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#141414; --fg:#f2f2f0; --muted:#9a9a96; --line:#2c2c2a; --accent:#f2f2f0; }
    }
    * { box-sizing:border-box; margin:0; }
    body {
      min-height:100vh; display:grid; place-items:center; padding:2rem;
      background:var(--bg); color:var(--fg);
      font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }
    main { max-width:420px; text-align:center; }
    img {
      width:120px; height:120px; border-radius:50%; object-fit:cover;
      border:1px solid var(--line); margin-bottom:1.5rem;
    }
    h1 { font-size:1.9rem; font-weight:600; letter-spacing:-0.02em; }
    .title { margin-top:.4rem; color:var(--muted); font-size:1rem; }
    .tagline { margin:1.5rem 0 2rem; line-height:1.55; font-size:1.05rem; }
    nav { display:flex; flex-direction:column; gap:.75rem; }
    .btn {
      display:block; width:100%; padding:.85rem 1rem; border:1px solid var(--accent);
      border-radius:8px; background:none; color:var(--fg); text-decoration:none;
      font:inherit; font-weight:500; cursor:pointer;
      transition:background .15s, color .15s;
    }
    .btn.primary, .btn:hover { background:var(--accent); color:var(--bg); }
    footer { margin-top:2.5rem; color:var(--muted); font-size:.85rem; }
  </style>
</head>
<body>
  <main>
    <img src="https://media.licdn.com/dms/image/v2/D4D03AQHTINHD9KN77Q/profile-displayphoto-scale_400_400/B4DZqU1bVWKUAg-/0/1763433625932?e=1795651200&v=beta&t=wu-FdGl8D6smklHhjVwQi-jdwafgduaeesrv5Tzm7u4" alt="Graham Smith">
    <h1>Graham Smith</h1>
    <p class="title">Digital Operations</p>
    <p class="tagline">Publishing infrastructure, web platforms, and ad systems for independent media.</p>
    <nav>
      <a class="btn primary" href="https://www.linkedin.com/in/YOUR-HANDLE">LinkedIn</a>
      <button class="btn" id="save-contact" type="button">Save Contact</button>
    </nav>
    <footer>Martha's Vineyard, MA</footer>
  </main>

  <script>
    document.getElementById('save-contact').addEventListener('click', function () {
      // Email is split up so it never appears whole in the page source
      var u = ['grahamgrafx'].join('');
      var d = ['gmail', 'com'].join('.');
      var email = u + '@' + d;

      var lines = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:Smith;Graham;;;',
        'FN:Graham Smith',
        'TITLE:Digital Operations ',
        'EMAIL;TYPE=INTERNET,WORK:' + email,
        'URL:https://www.linkedin.com/in/grahamgrafx',
        'ADR;TYPE=WORK:;;;Martha\'s Vineyad;MA;;USA',
        'END:VCARD'
      ];

      var blob = new Blob([lines.join('\r\n')], { type: 'text/vcard' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'Graham-Smith.vcf';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
    });
  </script>
</body>
</html>
